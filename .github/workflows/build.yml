name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release from this commit, e.g. v0.0.1 (needs docs/release-notes/<version>.md). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DopamineWeb
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src
      - run: bun run build
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: DopamineWeb/out

  mac:
    needs: web
    runs-on: macos-14
    defaults:
      run:
        working-directory: DopamineMac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: DopamineWeb/out
      - run: swift test
      - run: SKIP_WEB=1 ./scripts/bundle.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Dopamine-mac
          path: DopamineMac/dist/Dopamine-mac.zip

  windows:
    needs: web
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DopamineWin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: DopamineWeb/out
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      # Self-contained single exe: users need no .NET runtimes installed.
      - run: dotnet publish DopamineWin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - run: Compress-Archive -Path publish/* -DestinationPath Dopamine-win.zip
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with:
          name: Dopamine-win
          path: DopamineWin/Dopamine-win.zip

  # Runs for a pushed v* tag, or when started by hand with a version (the tag is then created here).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version and release notes
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3, got '$VERSION'"; exit 1; }
          test -f "docs/release-notes/$VERSION.md" || { echo "Missing docs/release-notes/$VERSION.md"; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          pattern: Dopamine-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dopamine ${{ env.VERSION }}
          body_path: docs/release-notes/${{ env.VERSION }}.md
          files: |
            Dopamine-mac.zip
            Dopamine-win.zip
