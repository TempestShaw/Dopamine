name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release from this commit, e.g. v0.0.1 (needs docs/release-notes/<version>.md). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DopamineWeb
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: DopamineWeb/out

  mac:
    needs: web
    runs-on: macos-14
    defaults:
      run:
        working-directory: DopamineMac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: DopamineWeb/out
      - run: swift test
      # A stable certificate keeps the Accessibility grant across updates; see scripts/make-signing-cert.sh.
      - name: Import code-signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret: signing ad hoc, so each update needs Accessibility switched on again."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=Dopamine Self-Signed" >> "$GITHUB_ENV"
      - run: SKIP_WEB=1 ./scripts/bundle.sh
      - name: Pack drag-to-install DMG
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH" ./scripts/dmg.sh
      - name: Generate signed Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No Sparkle signing key on this build; release publication requires a signed feed."
            exit 0
          fi
          curl -fL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle-tools" dist/feed
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"
          cp dist/Dopamine-mac.zip dist/feed/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" --ed-key-file - --download-url-prefix https://github.com/TempestShaw/Dopamine/releases/latest/download/ dist/feed
          cp dist/feed/appcast.xml dist/
      - uses: actions/upload-artifact@v7
        with:
          name: Dopamine-mac
          path: |
            DopamineMac/dist/Dopamine-mac.zip
            DopamineMac/dist/Dopamine-mac.dmg
            DopamineMac/dist/appcast.xml

  windows:
    needs: web
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DopamineWin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: DopamineWeb/out
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      # Native AOT: one native exe with the dashboard embedded; no .NET runtime needed.
      - run: dotnet publish DopamineWin.csproj -c Release -o publish
      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/DopamineWin.exe
          "Exe size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
          # A startup entry left by a copy that has since moved should be pointed at this exe.
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          # Fresh runners have no Run key yet; the app creates it itself (RegCreateKeyExW).
          if (-not (Test-Path $run)) { New-Item -Path $run | Out-Null }
          New-ItemProperty -Path $run -Name Dopamine -Value '"C:\old\DopamineWin.exe"' -PropertyType String -Force | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru
          $base = "http://127.0.0.1:26535"
          $info = $null
          for ($i = 0; $i -lt 30 -and -not $info; $i++) {
            try { $info = Invoke-RestMethod "$base/identify" } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $info -or $info.name -ne "dopamine-win") { throw "identify failed" }
          "identify: $($info.name) $($info.version)"
          $entry = (Get-ItemProperty -Path $run).Dopamine
          if ($entry -ne "`"$exe`"") { throw "startup entry not moved to this exe: $entry" }
          Remove-ItemProperty -Path $run -Name Dopamine
          "startup entry: $entry"

          $cfg = Get-Content "$env:LOCALAPPDATA\Dopamine\config.json" -Raw | ConvertFrom-Json
          $auth = @{ Authorization = "Bearer $($cfg.pairingCode)" }

          $denied = Invoke-WebRequest "$base/titles?from=0&to=1" -SkipHttpErrorCheck
          if ($denied.StatusCode -ne 401) { throw "expected 401 without the pairing code, got $($denied.StatusCode)" }

          Invoke-WebRequest "$base/pair" -Headers $auth | Out-Null
          Start-Sleep -Seconds 6   # let the tracker record at least one poll
          $titles = Invoke-RestMethod "$base/titles?from=0&to=9999999999" -Headers $auth
          "titles: $(@($titles).Count) rows"
          $apps = Invoke-RestMethod "$base/apps?names=pwsh" -Headers $auth
          "apps: $(($apps | ConvertTo-Json -Depth 3 -Compress).Length) bytes"

          $put = Invoke-RestMethod "$base/settings" -Method Put -Headers $auth -ContentType "application/json" -Body '{"idleTimeout":120,"categoryOverrides":{"Code":"study","Bad":"nope"}}'
          if ($put.idleTimeout -ne 120) { throw "settings update failed" }
          if ($put.categoryOverrides.Code -ne "study" -or $put.categoryOverrides.Bad) { throw "category overrides not validated" }
          $before = Invoke-RestMethod "$base/settings" -Headers $auth
          if (@($before.hiddenApps) -notcontains "DopamineWin") { throw "Dopamine itself should be hidden by default" }
          $hid = Invoke-RestMethod "$base/settings" -Method Put -Headers $auth -ContentType "application/json" -Body '{"hiddenApps":["Steam",""]}'
          if ((@($hid.hiddenApps) -join ",") -ne "Steam") { throw "hidden apps not saved: $(@($hid.hiddenApps) -join ',')" }

          $rules = Invoke-RestMethod "$base/settings" -Method Put -Headers $auth -ContentType "application/json" -Body '{"titleRules":[{"contains":" Lectures ","category":"study","scope":"browsers"},{"contains":"","category":"work","scope":"x"},{"contains":"a","category":"nope","scope":"x"}],"checkForUpdates":false}'
          if (@($rules.titleRules).Count -ne 1 -or $rules.titleRules[0].contains -ne "Lectures") { throw "title rules not validated: $($rules.titleRules | ConvertTo-Json -Compress)" }
          if ($rules.checkForUpdates -ne $false) { throw "checkForUpdates not saved" }

          $none = Invoke-RestMethod "$base/forget" -Method Post -Headers $auth -ContentType "application/json" -Body '{"ids":[999999999]}'
          if ($none.forgotten -ne 0) { throw "forget touched a row that doesn't exist" }
          $bad = Invoke-WebRequest "$base/forget" -Method Post -Headers $auth -ContentType "application/json" -Body '{"ids":"x"}' -SkipHttpErrorCheck
          if ($bad.StatusCode -ne 400) { throw "expected 400 for a bad forget request, got $($bad.StatusCode)" }
          # Invoke-RestMethod may pass a JSON array down the pipeline as one object; ForEach-Object unrolls it.
          $real = $titles | ForEach-Object { $_ } | Where-Object { $_.processName -ne "<Dopamine>" } | Select-Object -First 1
          if ($real) {
            $gone = Invoke-RestMethod "$base/forget" -Method Post -Headers $auth -ContentType "application/json" -Body "{`"ids`":[$($real.id)]}"
            $row = Invoke-RestMethod "$base/titles?from=0&to=9999999999" -Headers $auth | ForEach-Object { $_ } | Where-Object { $_.id -eq $real.id }
            if ($gone.forgotten -ne 1 -or $row.windowTitle -ne "<Forgotten>") {
              Get-Content "$env:LOCALAPPDATA\Dopamine\dopamine.log" -ErrorAction SilentlyContinue
              throw "forget did not erase row $($real.id): reply $($gone | ConvertTo-Json -Compress), row now $($row | ConvertTo-Json -Compress)"
            }
            "forget: erased row $($real.id) ($($real.processName))"
          } else {
            "forget: no window was recorded, so only the error cases were checked"
          }

          $page = Invoke-WebRequest "$base/"
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "<html") { throw "dashboard not served" }
          $js = ([regex]::Match($page.Content, '/_next/static/[^"]+\.js')).Value
          if ($js) { (Invoke-WebRequest "$base$js").Headers["Content-Type"] }

          $p = Get-Process -Id $proc.Id
          "Memory: working set {0:N1} MB, private {1:N1} MB" -f ($p.WorkingSet64 / 1MB), ($p.PrivateMemorySize64 / 1MB)

          # Launching it again asks the running agent to open the dashboard in its own window (WebView2).
          Start-Process -FilePath $exe
          $log = "$env:LOCALAPPDATA\Dopamine\dopamine.log"
          $loaded = $false
          for ($i = 0; $i -lt 60 -and -not $loaded; $i++) {
            Start-Sleep -Milliseconds 500
            $loaded = Select-String -Path $log -Pattern "Dashboard window loaded" -Quiet
          }
          $title = (Get-Process -Id $proc.Id).MainWindowTitle
          if (-not $loaded -or $title -ne "Dopamine") {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "the dashboard window did not open (window title '$title')"
          }
          "dashboard window: open and loaded"
          Stop-Process -Id $proc.Id
          Get-Content "$env:LOCALAPPDATA\Dopamine\dopamine.log" -ErrorAction SilentlyContinue
      - name: Package with Velopack
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path .tools
          $version = ([xml](Get-Content DopamineWin.csproj)).Project.PropertyGroup.Version
          .tools/vpk.exe pack --packId Dopamine --packVersion $version --packDir publish --mainExe DopamineWin.exe --packTitle Dopamine --icon assets/dopamine.ico --outputDir releases --delta None
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed" }
          $portable = Get-ChildItem releases/*-Portable.zip | Select-Object -First 1
          if (-not $portable) { throw "Missing Velopack portable archive" }
          Copy-Item $portable.FullName releases/Dopamine-win.zip
      - name: Verify installed and portable updates
        shell: pwsh
        run: ../tests/windows-updater/run.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Dopamine-win
          path: DopamineWin/releases/*

  # Runs for a pushed v* tag, or when started by hand with a version (the tag is then created here).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version and release notes
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3, got '$VERSION'"; exit 1; }
          grep -q "<string>${VERSION#v}</string>" DopamineMac/Resources/Info.plist
          test -f "docs/release-notes/$VERSION.md" || { echo "Missing docs/release-notes/$VERSION.md"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: Dopamine-*
          merge-multiple: true
      - name: Require update assets
        run: |
          test -s appcast.xml
          test -s Dopamine-mac.dmg
          test -s releases.win.json
          test -n "$(find . -maxdepth 1 -name '*-full.nupkg' -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dopamine ${{ env.VERSION }}
          body_path: docs/release-notes/${{ env.VERSION }}.md
          files: |
            Dopamine-mac.dmg
            Dopamine-mac.zip
            Dopamine-win.zip
            appcast.xml
            releases.win.json
            *-full.nupkg
            *-Setup.exe
