name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release from this commit, e.g. v0.0.1 (needs docs/release-notes/<version>.md). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DopamineWeb
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: DopamineWeb/out

  mac:
    needs: web
    runs-on: macos-14
    defaults:
      run:
        working-directory: DopamineMac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: DopamineWeb/out
      - run: swift test
      - run: SKIP_WEB=1 ./scripts/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Dopamine-mac
          path: DopamineMac/dist/Dopamine-mac.zip

  windows:
    needs: web
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DopamineWin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: DopamineWeb/out
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      # Native AOT: one native exe with the dashboard embedded; no .NET runtime needed.
      - run: dotnet publish DopamineWin.csproj -c Release -o publish
      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/DopamineWin.exe
          "Exe size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
          $proc = Start-Process -FilePath $exe -PassThru
          $base = "http://127.0.0.1:26535"
          $info = $null
          for ($i = 0; $i -lt 30 -and -not $info; $i++) {
            try { $info = Invoke-RestMethod "$base/identify" } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $info -or $info.name -ne "dopamine-win") { throw "identify failed" }
          "identify: $($info.name) $($info.version)"

          $cfg = Get-Content "$env:LOCALAPPDATA\Dopamine\config.json" -Raw | ConvertFrom-Json
          $auth = @{ Authorization = "Bearer $($cfg.pairingCode)" }

          $denied = Invoke-WebRequest "$base/titles?from=0&to=1" -SkipHttpErrorCheck
          if ($denied.StatusCode -ne 401) { throw "expected 401 without the pairing code, got $($denied.StatusCode)" }

          Invoke-WebRequest "$base/pair" -Headers $auth | Out-Null
          Start-Sleep -Seconds 6   # let the tracker record at least one poll
          $titles = Invoke-RestMethod "$base/titles?from=0&to=9999999999" -Headers $auth
          "titles: $(@($titles).Count) rows"
          $apps = Invoke-RestMethod "$base/apps?names=pwsh" -Headers $auth
          "apps: $(($apps | ConvertTo-Json -Depth 3 -Compress).Length) bytes"

          $put = Invoke-RestMethod "$base/settings" -Method Put -Headers $auth -ContentType "application/json" -Body '{"idleTimeout":120,"categoryOverrides":{"Code":"study","Bad":"nope"}}'
          if ($put.idleTimeout -ne 120) { throw "settings update failed" }
          if ($put.categoryOverrides.Code -ne "study" -or $put.categoryOverrides.Bad) { throw "category overrides not validated" }
          $before = Invoke-RestMethod "$base/settings" -Headers $auth
          if (@($before.hiddenApps) -notcontains "DopamineWin") { throw "Dopamine itself should be hidden by default" }
          $hid = Invoke-RestMethod "$base/settings" -Method Put -Headers $auth -ContentType "application/json" -Body '{"hiddenApps":["Steam",""]}'
          if ((@($hid.hiddenApps) -join ",") -ne "Steam") { throw "hidden apps not saved: $(@($hid.hiddenApps) -join ',')" }

          $page = Invoke-WebRequest "$base/"
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "<html") { throw "dashboard not served" }
          $js = ([regex]::Match($page.Content, '/_next/static/[^"]+\.js')).Value
          if ($js) { (Invoke-WebRequest "$base$js").Headers["Content-Type"] }

          $p = Get-Process -Id $proc.Id
          "Memory: working set {0:N1} MB, private {1:N1} MB" -f ($p.WorkingSet64 / 1MB), ($p.PrivateMemorySize64 / 1MB)
          Stop-Process -Id $proc.Id
          Get-Content "$env:LOCALAPPDATA\Dopamine\dopamine.log" -ErrorAction SilentlyContinue
      - run: Compress-Archive -Path publish/DopamineWin.exe -DestinationPath Dopamine-win.zip
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: Dopamine-win
          path: DopamineWin/Dopamine-win.zip

  # Runs for a pushed v* tag, or when started by hand with a version (the tag is then created here).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version and release notes
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3, got '$VERSION'"; exit 1; }
          test -f "docs/release-notes/$VERSION.md" || { echo "Missing docs/release-notes/$VERSION.md"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: Dopamine-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dopamine ${{ env.VERSION }}
          body_path: docs/release-notes/${{ env.VERSION }}.md
          files: |
            Dopamine-mac.zip
            Dopamine-win.zip
